<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIMS Inventory OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              background: '#101922',
              surface: '#1b2127',
              primary: '#1985f0',
              secondary: '#64748b',
              accent: '#3b82f6',
              danger: '#ef4444',
              success: '#10b981',
              warning: '#f59e0b',
            },
            backgroundImage: {
              'glass': 'linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%)',
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #101922;
        color: #f8fafc;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #101922;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      .glass-panel {
        background: rgba(27, 33, 39, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Print Styles for Invoice */
      @media print {
        body * {
          visibility: hidden;
        }
        #invoice-modal, #invoice-modal * {
          visibility: visible;
        }
        #invoice-modal {
          position: fixed;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
          background: white;
          color: black;
          padding: 40px;
          margin: 0;
          z-index: 9999;
          overflow: visible;
        }
        /* Hide scrollbars and toolbars when printing */
        .print\:hidden {
          display: none !important;
        }
        /* Ensure text is dark for printing */
        #invoice-modal h1, #invoice-modal h3, #invoice-modal p, #invoice-modal span, #invoice-modal div, #invoice-modal td, #invoice-modal th {
          color: #0f172a !important;
        }
        #invoice-modal .text-slate-500 {
            color: #64748b !important;
        }
        #invoice-modal .bg-slate-100 {
            background-color: #f1f5f9 !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
